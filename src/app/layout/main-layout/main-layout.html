<div class="app-container">
  <!-- ======================================
       SIDEBAR
  ======================================= -->
  <aside class="sidebar">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        E
      </div>
      <span class="logo-text">
        Employee Management
      </span>
    </div>
    <!-- Navigation -->
    <nav class="sidebar-nav">
      @for (menu of menuItems(); track menu.label) {
      <a class="menu-item" [class.active]="activeMenu() === menu.label" [routerLink]="menu.route"
        (click)="selectMenu(menu)">
        <span class="menu-icon">
          {{ menu.icon }}
        </span>
        <span class="menu-label">
          {{ menu.label }}
        </span>
      </a>
      }
    </nav>
    <!-- Sidebar Bottom -->
    <div class="sidebar-footer">
      <div class="store-status">
        <span class="status-dot"></span>
        <div>
          <strong>Store Online</strong>
          <small>All systems operational</small>
        </div>
      </div>
    </div>
  </aside>
  <!-- ======================================
       MAIN
  ======================================= -->
  <main class="main-content">
    <!-- ====================================
         HEADER
    ===================================== -->
    <header class="header">
      <!-- Mobile Menu -->
      <button class="mobile-menu-button">
        ☰
      </button>
      <!-- Search -->
      <div class="search-container visibility-hidden">
        <span class="search-icon">
          ⌕
        </span>
        <input type="text" placeholder="Search products, orders, SKUs..." />
      </div>
      <!-- Header Right -->
      <div class="header-right">
          <span class="profile-name">
            {{ userName() }}
          </span>
        <div class="profile-container">
          <button class="profile-button" (click)="toggleDropdown()">
            @if (profileImage) {
            <img [src]="profileImage" class="profile-image" alt="Profile" />
            } @else {
            <div class="profile-avatar">
              {{ userName().charAt(0).toUpperCase() }}
            </div>
            }
            <span class="profile-arrow">
              ▼
            </span>
          </button>
          @if (isDropdownOpen()) {
          <div class="dropdown-menu">
            <button (click)="profile()">
              <span>👤</span>
              Profile
            </button>
            <button (click)="settings()">
              <span>⚙</span>
              Settings
            </button>
            <div class="dropdown-divider"></div>
            <button class="logout" (click)="logout()">
              <span>↪</span>
              Logout
            </button>
          </div>
          }
        </div>
      </div>
    </header>
    <!-- ====================================
         DASHBOARD CONTENT
    ===================================== -->
    <section class="content">
      <router-outlet />
    </section>
  </main>
</div>
