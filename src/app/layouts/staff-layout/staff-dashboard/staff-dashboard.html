<div class="staff-dashboard">

    <div class="dashboard-header">

        <div>

            <h1>
                Staff Dashboard
            </h1>

            <p>
                Manage your appointments and daily activities.
            </p>

        </div>

    </div>


    <div class="dashboard-cards">


        <!-- TODAY'S APPOINTMENTS -->

        <div class="dashboard-card">

            <h3>
                Today's Appointments
            </h3>

            <h2>
                {{ todayAppointments() }}
            </h2>

        </div>


        <!-- PENDING -->

        <div class="dashboard-card">

            <h3>
                Pending Appointments
            </h3>

            <h2>
                {{ pendingAppointments() }}
            </h2>

        </div>


        <!-- CONFIRMED -->

        <div class="dashboard-card">

            <h3>
                Confirmed
            </h3>

            <h2>
                {{ confirmedAppointments() }}
            </h2>

        </div>


        <!-- COMPLETED -->

        <div class="dashboard-card">

            <h3>
                Completed
            </h3>

            <h2>
                {{ completedAppointments() }}
            </h2>

        </div>


    </div>

</div>
